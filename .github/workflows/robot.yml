name: Surveillance Prix FC27

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  verifier_prix:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les outils web
        run: pip install requests beautifulsoup4

      - name: Lancer le script de prix
        run: python fc27_tracker.py
